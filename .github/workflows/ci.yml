name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_VERSION: "16"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & formatting
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2: Migration consistency check
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: manageopd_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load CI environment
        run: cp .env.ci .env

      - name: Apply all migrations
        run: python manage.py migrate --run-syncdb

      - name: Check no migrations are missing
        # Fails if any app has model changes without a corresponding migration
        run: python manage.py migrate --check

      - name: Run Django system check
        run: python manage.py check

  # ---------------------------------------------------------------------------
  # Job 3: Test suite with coverage
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: [lint, migrations]
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_DB: manageopd_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load CI environment
        run: cp .env.ci .env

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-omit="*/migrations/*,*/venv/*,*/.venv/*,manage.py,conftest.py" \
            -v

  # ---------------------------------------------------------------------------
  # Job 4: Dependency vulnerability audit
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Audit dependencies for known CVEs
        # --desc shows the CVE description; --fix is NOT passed so this is read-only
        run: pip-audit -r requirements.txt --desc
